name: Build Analisi Fattura Energia APK
on:
  push:
    branches: [ fattura-energia-v1 ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :fatturaapp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AnalisiFatturaEnergia-v1.0
          path: fatturaapp/build/outputs/apk/debug/fatturaapp-debug.apk
